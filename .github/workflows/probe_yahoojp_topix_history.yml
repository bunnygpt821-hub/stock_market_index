name: Probe YahooJP TOPIX History

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/probe_yahoojp_topix_history.py'
      - '.github/workflows/probe_yahoojp_topix_history.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pandas requests lxml
      - name: Probe Yahoo Japan
        run: python analysis/probe_yahoojp_topix_history.py
