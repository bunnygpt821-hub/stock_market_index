name: Paradise Lost Survivor Validate

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/paradise_lost_survivor_validate.py'
      - '.github/workflows/paradise_lost_survivor_validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/paradise-lost
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Validate survivor
        run: python analysis/paradise_lost_survivor_validate.py
      - name: Show summary
        run: cat analysis_outputs/paradise_lost_survivor_validate/summary.txt
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_outputs/paradise_lost_survivor_validate
          git diff --cached --quiet || git commit -m 'Add survivor validation results'
          git push origin analysis/paradise-lost
