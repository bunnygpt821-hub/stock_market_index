name: Paradise Lost Exact Source

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/rebuild_yahoo_clean_sep18.py'
      - 'analysis/paradise_lost_exactsource_calibrate.py'
      - '.github/workflows/paradise_lost_exactsource.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  exactsource:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance

      - name: Rebuild original Yahoo-clean source through 2026-09-18
        run: python analysis/rebuild_yahoo_clean_sep18.py

      - name: Calibrate A+ fingerprint on exact source
        run: python analysis/paradise_lost_exactsource_calibrate.py

      - name: Show result
        run: cat analysis_outputs/paradise_lost_exactsource/summary.txt

      - name: Commit summary outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/paradise_lost_exactsource/
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "Add Paradise Lost exact-source calibration outputs"
          git push
