name: Paradise Lost Calibration V2

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/paradise_lost_calibrate_v2.py'
      - '.github/workflows/paradise_lost_calibrate_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Run calibration v2
        run: python analysis/paradise_lost_calibrate_v2.py

      - name: Show summary
        run: cat analysis_outputs/paradise_lost_v2/calibration_summary_v2.txt

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/paradise_lost_v2/
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "Add Paradise Lost calibration v2 outputs"
          git push
