name: Probe TOPIX Sources

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/probe_topix_sources.py'
      - '.github/workflows/probe_topix_sources.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install pandas requests
      - name: Probe
        run: python analysis/probe_topix_sources.py
