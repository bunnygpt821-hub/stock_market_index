name: Paradise Lost Altitude Regime Path

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/paradise_lost_altitude_regime_path.py'
      - '.github/workflows/paradise_lost_altitude_regime_path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - run: python analysis/paradise_lost_altitude_regime_path.py
      - run: cat analysis_outputs/paradise_lost_altitude_regime_path/summary.txt
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/paradise_lost_altitude_regime_path/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add altitude regime path outputs"
          git push
