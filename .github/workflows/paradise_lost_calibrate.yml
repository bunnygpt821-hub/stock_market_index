name: Paradise Lost Calibration

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/paradise_lost_calibrate.py'
      - 'analysis/paradise_lost_calibrate_dedup.py'
      - '.github/workflows/paradise_lost_calibrate.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Refresh fixed-constituent price histories
        run: python scripts/update_nikkei225_prices.py --repo-root . --price-provider yahoo --retries 5 --sleep-seconds 0.08 --rate-limit-cooldown-seconds 90 --rate-limit-max-retries 1

      - name: Run base calibration through 2026-09-22
        run: |
          python - <<'PY'
          import sys
          import pandas as pd
          sys.path.insert(0, 'analysis')
          import paradise_lost_calibrate as m
          m.END = pd.Timestamp('2026-09-22')
          m.main()
          PY

      - name: Run dedup calibration through 2026-09-22
        run: |
          python - <<'PY'
          import sys
          import pandas as pd
          sys.path.insert(0, 'analysis')
          import paradise_lost_calibrate as base
          base.END = pd.Timestamp('2026-09-22')
          import paradise_lost_calibrate_dedup as d
          d.base.END = pd.Timestamp('2026-09-22')
          d.main()
          PY

      - name: Show summaries
        run: |
          echo '=== BASE ==='
          cat analysis_outputs/paradise_lost/calibration_summary.txt
          echo '=== DEDUP ==='
          cat analysis_outputs/paradise_lost_dedup/dedup_summary.txt

      - name: Commit calibration outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/paradise_lost/ analysis_outputs/paradise_lost_dedup/
          if git diff --cached --quiet; then
            echo "No output changes."
            exit 0
          fi
          git commit -m "Update Paradise Lost calibration outputs through 2026-09-22"
          git push
