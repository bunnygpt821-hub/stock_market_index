name: Paradise Lost A+ v2 Analysis

on:
  push:
    branches:
      - analysis/paradise-lost
    paths:
      - 'analysis/paradise_lost_v2_analysis.py'
      - '.github/workflows/paradise_lost_historical_high.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  v2-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Rebuild exact Yahoo-clean source
        run: python analysis/rebuild_yahoo_clean_sep18.py
      - name: Run A+ v2 selector analysis
        run: python analysis/paradise_lost_v2_analysis.py
      - name: Show summary
        run: cat analysis_outputs/paradise_lost_v2/summary.txt
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_outputs/paradise_lost_v2/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add reproducible Paradise Lost A+ v2 analysis outputs"
          git push
